<script>
const STAFF=[
 {n:"佐伯ゆき",ini:"佐",tm:"大須 10:00～22:00",ok:true,badges:["rec"],prof:"店長 ／ 歴8年。ドライヘッド全般、眼精疲労ケア。側頭部の張りをほどく圧の対話が得意です。"},
