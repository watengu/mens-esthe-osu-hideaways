<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出勤情報｜大須のメンズエステ【ねむりどき 大須店】（デモ）</title><link rel="stylesheet" href="style.css"></head><body>
<div class="demo">サンプル／デモサイトです（架空の店舗・人物・出勤はサンプル表示）</div><div id="splash"><div class="lg">ねむりどき<small>NEMURIDOKI OSU</small></div></div><header class="top"><div class="logo"><span class="g">ね</span>むりどき<small>NEMURIDOKI OSU</small></div></header>
<nav class="main"><a href="index.html">トップ</a><a href="schedule.html" class="on">出勤情報</a><a href="system.html">料金システム</a><a href="therapist.html">セラピスト</a><a href="index.html#access">アクセス</a></nav>
<div class="banner"><img src="img/interior.jpg"><div class="veil"></div><div class="lg">ねむりどき</div></div>
<section><h2 class="sec"><span class="en">Schedule</span><span class="ja">出勤情報</span></h2>
<div class="tabs" id="dates"></div>
<button class="nextweek" id="nextweek">次の週 ›</button>
<div class="tabs"><span class="on">全員</span><span>大須</span></div>
<div class="grid" id="list"></div>
<p class="note">出勤はサンプルデータです（デモ）。ご予約可能の表示がある時間帯で承ります。</p>
</section>
<footer><div class="fl">ねむりどき</div>ねむりどき 大須店（架空）<br>052-XXX-XXXX（サンプル）<br>OPEN：10:00～23:00<br>このサイトは販売デモです。実在の店舗・人物とは関係ありません。</footer>
<div class="bar"><a href="tel:0520000000">電話予約</a><a class="line" href="#">LINEで予約（デモ）</a><span class="open">OPEN 10:00～23:00</span></div>
<script src="staff.js"></script>
<script>
const WD=["日","月","火","水","木","金","土"];
const today=new Date(); today.setHours(0,0,0,0);
let week=0, sel=0;
const tabs=document.getElementById("dates");
function drawTabs(){
 tabs.innerHTML="";
 for(let i=0;i<7;i++){
  const d=new Date(today); d.setDate(d.getDate()+week*7+i);
  const b=document.createElement("button");
  b.textContent=`${d.getMonth()+1}月${String(d.getDate()).padStart(2,"0")}日(${WD[d.getDay()]})`;
  if(d.getDay()===0)b.classList.add("sun"); if(d.getDay()===6)b.classList.add("sat");
  if(i===sel)b.classList.add("on");
  b.onclick=()=>{sel=i;drawTabs();render()};
  tabs.appendChild(b);
 }
 document.getElementById("nextweek").textContent = week===0 ? "次の週 ›" : "‹ 前の週";
}
document.getElementById("nextweek").onclick=()=>{week=week===0?1:0;sel=0;drawTabs();render()};
function render(){
 const di=week*7+sel;
 const list=STAFF.filter((s,si)=>(si+di)%4!==3).map(s=>{const c=Object.assign({},s,{tm:s.base,ok:true});return cardHTML(c)}).join("");
 document.getElementById("list").innerHTML=list;
}
drawTabs(); render();
</script>
</body></html>
